kind = "web"
previewPath = "/"
title = "Heritage Skinwear Studio"
description = "A polished, image-led storefront for handcrafted cultural skinwear, designed to showcase collections and turn social traffic into personal WhatsApp enquiries."
version = "1.0.0"
id = "artifacts/heritage-skinwear"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20411

[services.development]
run = "pnpm --filter @workspace/heritage-skinwear run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/heritage-skinwear", "run", "build" ]
serve = "static"
publicDir = "artifacts/heritage-skinwear/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20411"
BASE_PATH = "/"
